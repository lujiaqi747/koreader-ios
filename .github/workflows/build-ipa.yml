name: Build KOReader iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Install dependencies
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_UPGRADE=1

          brew install \
            autoconf \
            automake \
            bash \
            binutils \
            cmake \
            coreutils \
            findutils \
            gettext \
            gnu-getopt \
            libtool \
            make \
            meson \
            nasm \
            ninja \
            pkgconf \
            sdl3 \
            util-linux \
            xcodegen

      - name: Setup GNU tools
        run: |
          {
            echo "$(brew --prefix)/opt/findutils/libexec/gnubin"
            echo "$(brew --prefix)/opt/gnu-getopt/bin"
            echo "$(brew --prefix)/opt/make/libexec/gnubin"
            echo "$(brew --prefix)/opt/util-linux/bin"
          } >> "$GITHUB_PATH"

      - name: Build macOS host
        run: |
          make TARGET=macos base

      - name: Generate iOS Xcode project
        run: |
          make TARGET=ios xcodeproj

      - name: Generate Info.plist
        run: |
          VERSION="$(git describe --tags --always)"
          sed "s|@VERSION@|${VERSION#v}|g" \
            platform/ios/Info.plist.in \
            > platform/ios/Info.plist

      - name: Archive iOS app
        run: |
          xcodebuild \
            -project KOReader.xcodeproj \
            -scheme KOReader \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/KOReader.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload

          cp -R \
            "$RUNNER_TEMP/KOReader.xcarchive/Products/Applications/KOReader.app" \
            Payload/KOReader.app

          mkdir -p artifact

          /usr/bin/zip -r \
            artifact/KOReader-iOS-unsigned.ipa \
            Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: KOReader-iOS-unsigned-IPA
          path: artifact/KOReader-iOS-unsigned.ipa
          retention-days: 7
